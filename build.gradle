            throw new GradleException("Fabric 26.3 Transport still has ${offenders.size()} NeoForge Java files:\n"
                + offenders.take(80).join('\n'))
        }
    }
}
tasks.named('jar') { dependsOn verifyTransportIsolation }
tasks.named('check') { dependsOn verifyTransportIsolation }

